# XcodeGen spec: `make ios-project` (or `xcodegen` here) regenerates Padel.xcodeproj, which is not committed.
name: Padel
options:
  bundleIdPrefix: app.americanoo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Set by scripts/bump-version.sh on every tag (make tag / make release); same for app, widgets and watch.
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    # The Kotlin framework build (below) runs Gradle outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Shared Kotlin Multiplatform module, built for the current SDK/arch by embedAndSignAppleFrameworkForXcode.
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../mobile-shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.19.0"
targets:
  Padel:
    type: application
    platform: iOS
    sources:
      - path: Padel
      - path: Shared
      - path: Connectivity
      # Also in the app so its tests can render the widget and Live Activity views.
      - path: PadelWidgets/WidgetViews.swift
    entitlements:
      path: Padel/Padel.entitlements
      properties:
        # Universal Links: https://padel-americanoo.com/g/… opens the app (AASA served by apps/web).
        com.apple.developer.associated-domains: [applinks:padel-americanoo.com]
    dependencies:
      - target: PadelWidgets
      # Apple Watch app, embedded under Watch/ and installed on the paired watch.
      - target: PadelWatch
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
    info:
      path: Padel/Info.plist
      properties:
        CFBundleDisplayName: Americanoo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # americanoo://g/CODE?key=… from QR codes, widgets and the Live Activity.
        CFBundleURLTypes:
          - CFBundleURLName: app.americanoo.link
            CFBundleURLSchemes: [americanoo]
        NSSupportsLiveActivities: true
        # Only local-network hosts (make dev on localhost) may use plain http; everything else stays https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Scan a game's QR code or game code to join it.
        NSPhotoLibraryUsageDescription: Read a game's QR code or game code from a photo or screenshot.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Geist.ttf
          - GeistMono.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.americanoo.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # -ObjC: Firebase Analytics' Objective-C categories.
        OTHER_LDFLAGS: "$(inherited) -ObjC -framework PadelShared"
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED}" = "YES" ]; then exit 0; fi
          cd "$SRCROOT/../mobile-shared"
          ./gradlew :embedAndSignAppleFrameworkForXcode --console=plain
  PadelWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PadelWidgets
      - path: Shared
    entitlements:
      path: PadelWidgets/PadelWidgets.entitlements
    info:
      path: PadelWidgets/Info.plist
      properties:
        CFBundleDisplayName: Americanoo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Geist.ttf
          - GeistMono.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.americanoo.ios.widgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # The extension doesn't use the Kotlin framework.
        OTHER_LDFLAGS: "$(inherited)"
  PadelWatch:
    type: application
    platform: watchOS
    sources:
      - path: PadelWatch
      - path: Connectivity
    info:
      path: PadelWatch/Info.plist
      properties:
        CFBundleDisplayName: Americanoo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.americanoo.ios
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.americanoo.ios.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        # Same Kotlin framework as the phone, built for watchOS (arm64_32 / arm64 / simulator).
        OTHER_LDFLAGS: "$(inherited) -framework PadelShared"
        # Embedded builds (e.g. iPhone tests) would add x86_64: the Kotlin framework has no such slice.
        EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED}" = "YES" ]; then exit 0; fi
          cd "$SRCROOT/../mobile-shared"
          ./gradlew :embedAndSignAppleFrameworkForXcode --console=plain
  PadelWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: PadelWatchUITests
    dependencies:
      - target: PadelWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.americanoo.ios.watchuitests
        TEST_TARGET_NAME: PadelWatch
  PadelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PadelTests
    dependencies:
      - target: Padel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.americanoo.ios.tests
  PadelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PadelUITests
    dependencies:
      - target: Padel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.americanoo.ios.uitests
        TEST_TARGET_NAME: Padel
schemes:
  PadelWatch:
    build:
      targets:
        PadelWatch: all
        PadelWatchUITests: [test]
    test:
      targets:
        - PadelWatchUITests
  Padel:
    build:
      targets:
        Padel: all
        PadelTests: [test]
        PadelUITests: [test]
    test:
      targets:
        - PadelTests
        - PadelUITests
