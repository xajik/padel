# Version of the iOS, Apple Watch, Android and Wear OS apps. Set by `make tag` / `make release`
# (scripts/bump-version.sh): version = the tag without "v" and without a ".0" patch (v1.1.0 → 1.1),
# build goes up by one on every tag unless BUILD=N is given.
# Read by apps/android/*/build.gradle.kts; mirrored into apps/ios/project.yml.
version=1.1.6
build=11
